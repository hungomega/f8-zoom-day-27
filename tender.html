<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .list {
            width: 300px;
            height: 300px;
            overflow: hidden;
            border: 1px solid #000;
            position: relative;
        }

        .item {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;

            overflow: hidden;
            border-radius: 15px;
        }
        .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .info {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;

            color: #fff;
            font-size: 16px;
        }
        .item:nth-child(1) .info {
            color: black;
        }
        .item::after {
            content: "";
            position: absolute;
            inset: 0;

            pointer-events: none;
            transition: opacity 0.1s;
        }

        .item.swipe-left::after {
            background: rgba(255, 0, 0, 0.5);
            /* opacity: 1; */
        }

        .item.swipe-right::after {
            background: rgba(0, 100, 255, 0.5);
            /* opacity: 1; */
        }
    </style>
    <body>
        <div class="list"></div>
        <script src="./js/tender.js"></script>
    </body>
</html>
