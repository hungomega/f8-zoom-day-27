<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .editor {
            display: flex;

            height: 100vh;
        }
        #code {
            width: 50%;
            height: 100%;
            background-color: #252526;
            color: #fff;
            font-family: monospace;
            font-size: 16px;
        }
        #preview {
            width: 50%;
            height: 100%;
            background-color: #fff;
        }
        #context-menu {
            position: fixed;
            display: none;
            width: 120px;
            background-color: #fff;
            border: 1px solid #ccc;
        }
        #delete-code {
            padding: 10px;
            cursor: pointer;
        }
        #delete-code:hover {
            background-color: #eee;
        }
    </style>
    <body>
        <div class="editor">
            <textarea id="code"></textarea>
            <iframe id="preview"></iframe>
        </div>
        <div id="context-menu">
            <div id="delete-code">xoá code</div>
        </div>
        <script src="./js/live-code-editor.js"></script>
    </body>
</html>
